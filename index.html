<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bottle Catcher — Pilsner Style</title>
<style>
  body {
    margin: 0;
    background: #062413;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #wrap {
    position: relative;
    width: 480px;
    height: 640px;
    max-width: 100%;
  }

  canvas {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #187944 0%, #0c4d2b 100%);
    border: 4px solid #d4a017;
    border-radius: 12px;
    touch-action: none;
    width: 100%;
    height: 100%;
  }

  #pause {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .78);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    border-radius: 10px;
  }

  #pause h2 {
    font-size: 32px;
    margin: 0 0 10px;
    color: #d4a017;
  }

  #pause p {
    font-size: 20px;
    margin: 0;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="g" width="480" height="640"></canvas>

  <div id="pause">
    <h2>BOTTLE FILLING!</h2>
    <p id="timer">10</p>
  </div>
</div>

<script>
const c = document.getElementById("g");
const x = c.getContext("2d");
const pauseBox = document.getElementById("pause");
const timerText = document.getElementById("timer");

let state = "start";
let crate = { x: 170, w: 110, h: 40 };
let bottles = [];
let score = 0;
let best = +(localStorage.getItem("bc_best") || 0);
let level = 1;
let missed = 0;
let spawnTimer = 0;
let fill = 0;
let paused = false;
let pauseLeft = 0;
let keys = {};

const colors = [
  "#0f7a3d",
  "#e11d48",
  "#2563eb",
  "#f59e0b",
  "#7c3aed",
  "#14b8a6"
];

const audio = new (window.AudioContext || window.webkitAudioContext)();

function beep(frequency, duration, type = "square", volume = .06) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type;
  osc.frequency.value = frequency;
  gain.gain.value = volume;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration);
  osc.stop(audio.currentTime + duration);
}

function resetGame() {
  crate.x = 170;
  bottles = [];
  score = 0;
  level = 1;
  missed = 0;
  spawnTimer = 0;
  fill = 0;
  paused = false;
  pauseBox.style.display = "none";
}

function startGame() {
  resetGame();
  state = "play";
  beep(660, .12, "triangle");
}

function spawnBottle() {
  bottles.push({
    x: 20 + Math.random() * (c.width - 130),
    y: -40,
    speed: 2.1 + level * .35,
    color: colors[Math.floor(Math.random() * colors.length)]
  });
}

function startPause() {
  paused = true;
  pauseLeft = 10;
  pauseBox.style.display = "flex";
  timerText.textContent = "10";

  beep(1000, .4, "sine", .09);

  const countdown = setInterval(() => {
    pauseLeft--;
    timerText.textContent = pauseLeft;

    if (pauseLeft <= 0) {
      clearInterval(countdown);
      paused = false;
      pauseBox.style.display = "none";
      beep(700, .2, "triangle");
    }
  }, 1000);
}

function update() {
  if (state !== "play" || paused) return;

  if (keys.ArrowLeft && crate.x > 0) {
    crate.x -= 8.5;
  }

  if (keys.ArrowRight && crate.x < c.width - 120 - crate.w) {
    crate.x += 8.5;
  }

  spawnTimer--;

  if (spawnTimer <= 0) {
    spawnBottle();
    spawnTimer = Math.max(16, 52 - level * 4);
  }

  bottles = bottles.filter(bottle => {
    bottle.y += bottle.speed;

    const caught =
      bottle.y > 565 &&
      bottle.y < 612 &&
      bottle.x > crate.x &&
      bottle.x < crate.x + crate.w;

    if (caught) {
      score++;
      beep(880 + score % 5 * 80, .08, "triangle");

      if (score % 20 === 0) {
        fill = Math.min(100, fill + 20);
        startPause();
      }

      if (score % 10 === 0) {
        level++;
        beep(1000, .15, "sine", .07);
      }

      return false;
    }

    if (bottle.y > c.height) {
      missed++;
      beep(150, .25, "sawtooth", .08);

      if (missed >= 3) {
        state = "over";

        if (score > best) {
          best = score;
          localStorage.setItem("bc_best", best);
        }

        beep(90, .5, "sawtooth", .09);
      }

      return false;
    }

    return true;
  });
}

function drawFallingBottle(bottle) {
  x.save();
  x.translate(bottle.x, bottle.y);

  x.fillStyle = bottle.color;
  x.beginPath();
  x.moveTo(-6, -34);
  x.lineTo(6, -34);
  x.lineTo(6, -24);
  x.quadraticCurveTo(13, -16, 13, -2);
  x.lineTo(13, 22);
  x.quadraticCurveTo(13, 30, 5, 30);
  x.lineTo(-5, 30);
  x.quadraticCurveTo(-13, 30, -13, 22);
  x.lineTo(-13, -2);
  x.quadraticCurveTo(-13, -16, -6, -24);
  x.closePath();
  x.fill();

  x.fillStyle = "#111";
  x.fillRect(-4, -42, 8, 10);

  x.fillStyle = "rgba(255,255,255,.75)";
  x.fillRect(-9, -8, 5, 24);

  x.restore();
}

function drawSideBottle() {
  const boxX = 390;
  const boxY = 80;
  const boxW = 55;
  const boxH = 260;

  x.fillStyle = "#09381e";
  x.fillRect(boxX - 8, boxY - 8, boxW + 16, boxH + 45);

  x.strokeStyle = "#d4a017";
  x.lineWidth = 2;
  x.strokeRect(boxX - 8, boxY - 8, boxW + 16, boxH + 45);

  x.save();
  x.translate(boxX + boxW / 2, boxY);

  x.fillStyle = "#c5a059";
  x.beginPath();
  x.moveTo(-8, 0);
  x.lineTo(8, 0);
  x.lineTo(8, 15);
  x.quadraticCurveTo(22, 28, 22, 50);
  x.lineTo(22, boxH - 20);
  x.quadraticCurveTo(22, boxH, 10, boxH);
  x.lineTo(-10, boxH);
  x.quadraticCurveTo(-22, boxH, -22, boxH - 20);
  x.lineTo(-22, 50);
  x.quadraticCurveTo(-22, 28, -8, 15);
  x.closePath();
  x.fill();

  const maxLiquid = boxH - 25;
  const liquidHeight = maxLiquid * fill / 100;

  x.save();
  x.beginPath();
  x.moveTo(-8, 0);
  x.lineTo(8, 0);
  x.lineTo(8, 15);
  x.quadraticCurveTo(22, 28, 22, 50);
  x.lineTo(22, boxH - 20);
  x.quadraticCurveTo(22, boxH, 10, boxH);
  x.lineTo(-10, boxH);
  x.quadraticCurveTo(-22, boxH, -22, boxH - 20);
  x.lineTo(-22, 50);
  x.quadraticCurveTo(-22, 28, -8, 15);
  x.closePath();
  x.clip();

  x.fillStyle = "#d81e05";
  x.fillRect(-25, boxH - liquidHeight, 50, liquidHeight);
  x.restore();

  x.fillStyle = "#111";
  x.fillRect(-5, -12, 10, 14);

  x.fillStyle = "#fff";
  x.font = "bold 12px Arial";
  x.textAlign = "center";
  x.fillText("BEER", 0, 130);

  x.restore();

  x.fillStyle = "#fff";
  x.font = "bold 15px Arial";
  x.textAlign = "center";
  x.fillText(fill + "%", boxX + boxW / 2, boxY + boxH + 24);
  x.textAlign = "left";
}

function draw() {
  x.clearRect(0, 0, c.width, c.height);

  // Background branding text watermark effect
  x.fillStyle = "rgba(255, 255, 255, 0.04)";
  x.font = "italic bold 42px Georgia";
  x.fillText("Pilsner Urquell", 45, 240);

  x.fillStyle = "#0b3b20";
  x.fillRect(0, 560, c.width, 80);

  bottles.forEach(drawFallingBottle);
  drawSideBottle();

  // Crate / Box at bottom
  x.fillStyle = "#0c5a2c";
  x.fillRect(crate.x, 578, crate.w, 34);
  x.strokeStyle = "#d4a017";
  x.lineWidth = 2;
  x.strokeRect(crate.x, 578, crate.w, 34);

  x.fillStyle = "#8b5e17";
  x.fillRect(crate.x + 5, 588, crate.w - 10, 6);

  // Missed caps indicators (red caps)
  for (let i = 0; i < 3; i++) {
    x.fillStyle = i < missed ? "#555" : "#e11d48";
    x.beginPath();
    x.arc(28 + i * 24, 540, 9, 0, Math.PI * 2);
    x.fill();
    x.strokeStyle = "#fff";
    x.lineWidth = 1.5;
    x.stroke();
  }

  x.fillStyle = "#fff";
  x.font = "bold 18px Arial";
  x.fillText("Score: " + score, 15, 35);
  
  x.fillStyle = "#fbbf24";
  x.font = "14px Arial";
  x.fillText("Best: " + best, 15, 60);

  if (state === "start") {
    x.fillStyle = "rgba(0,0,0,.85)";
    x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = "#d4a017";
    x.font = "bold 28px Arial";
    x.textAlign = "center";
    x.fillText("BOTTLE CATCHER", c.width / 2, 220);

    x.fillStyle = "#fff";
    x.font = "18px Arial";
    x.fillText("Catch bottles in the crate!", c.width / 2, 275);
    x.fillText("Every 20 points fills the glass", c.width / 2, 310);
    x.fillText("Arrow keys / touch to move", c.width / 2, 365);
    x.fillStyle = "#fbbf24";
    x.fillText("Press SPACE or tap to start", c.width / 2, 420);
    x.textAlign = "left";
  }

  if (state === "over") {
    x.fillStyle = "rgba(0,0,0,.85)";
    x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = "#e11d48";
    x.font = "bold 34px Arial";
    x.textAlign = "center";
    x.fillText("GAME OVER", c.width / 2, 260);

    x.fillStyle = "#fff";
    x.font = "20px Arial";
    x.fillText("Score: " + score, c.width / 2, 320);
    x.fillText("Best: " + best, c.width / 2, 355);
    
    x.fillStyle = "#fbbf24";
    x.fillText("Press R or tap to restart", c.width / 2, 410);
    x.textAlign = "left";
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

addEventListener("keydown", event => {
  keys[event.key] = true;

  if (event.code === "Space" && state === "start") {
    startGame();
  }

  if (event.key.toLowerCase() === "r" && state === "over") {
    startGame();
  }
});

addEventListener("keyup", event => {
  keys[event.key] = false;
});

c.addEventListener("pointerdown", () => {
  if (audio.state === "suspended") {
    audio.resume();
  }

  if (state === "start" || state === "over") {
    startGame();
  }
});

c.addEventListener("pointermove", event => {
  if (state !== "play" || paused) return;

  const rect = c.getBoundingClientRect();
  const scaleX = c.width / rect.width;

  crate.x = Math.max(
    0,
    Math.min(
      c.width - 120 - crate.w,
      (event.clientX - rect.left) * scaleX - crate.w / 2
    )
  );
});

gameLoop();
</script>

</body>
</html>
