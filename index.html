<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bottle Catcher — 6 Outfits</title>
<style>
  body {
    margin: 0;
    background: #0b0f14;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #wrap {
    position: relative;
    width: 480px;
    height: 640px;
    max-width: 100%;
  }

  canvas {
    position: absolute;
    inset: 0;
    background: #182230;
    border: 4px solid #d4a017;
    border-radius: 12px;
    touch-action: none;
    width: 100%;
    height: 100%;
  }

  #girl {
    position: absolute;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    height: 270px;
    object-fit: contain;
    pointer-events: none;
    transition: opacity .25s;
  }

  #girl.swap {
    opacity: 0;
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="girl" src="girl1.png" alt="Outfit 1">
  <canvas id="g" width="480" height="640"></canvas>
</div>

<script>
const c = document.getElementById("g");
const x = c.getContext("2d");
const girl = document.getElementById("girl");

let state = "start";
let crate = { x: 185, w: 110, h: 40 };
let bottles = [];
let score = 0;
let best = +(localStorage.getItem("bc_best") || 0);
let level = 1;
let missed = 0;
let spawnTimer = 0;
let outfit = 1;
let keys = {};

const bottleColors = [
  "#0f7a3d",
  "#e11d48",
  "#2563eb",
  "#f59e0b",
  "#7c3aed",
  "#14b8a6"
];

const audio = new (window.AudioContext || window.webkitAudioContext)();

function beep(frequency, duration, type = "square", volume = .06) {
  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type;
  osc.frequency.value = frequency;
  gain.gain.value = volume;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + duration);
  osc.stop(audio.currentTime + duration);
}

function resetGame() {
  crate.x = 185;
  bottles = [];
  score = 0;
  level = 1;
  missed = 0;
  spawnTimer = 0;
  outfit = 1;
  girl.src = "girl1.png";
}

function startGame() {
  resetGame();
  state = "play";
  beep(660, .12, "triangle");
}

function spawnBottle() {
  bottles.push({
    x: 25 + Math.random() * (c.width - 50),
    y: -35,
    speed: 2.1 + level * .35,
    color: bottleColors[Math.floor(Math.random() * bottleColors.length)]
  });
}

function changeOutfit() {
  outfit = outfit % 6 + 1;

  girl.classList.add("swap");

  setTimeout(() => {
    girl.src = "girl" + outfit + ".png";

    girl.onload = () => {
      girl.classList.remove("swap");
    };
  }, 250);

  beep(1200, .2, "sine", .09);
}

function update() {
  if (state !== "play") return;

  if (keys.ArrowLeft && crate.x > 0) {
    crate.x -= 8.5;
  }

  if (keys.ArrowRight && crate.x < c.width - crate.w) {
    crate.x += 8.5;
  }

  spawnTimer--;

  if (spawnTimer <= 0) {
    spawnBottle();
    spawnTimer = Math.max(16, 52 - level * 4);
  }

  bottles = bottles.filter(bottle => {
    bottle.y += bottle.speed;

    const caught =
      bottle.y > 565 &&
      bottle.y < 612 &&
      bottle.x > crate.x &&
      bottle.x < crate.x + crate.w;

    if (caught) {
      score++;
      beep(880 + score % 5 * 80, .08, "triangle");

      if (score % 20 === 0) {
        changeOutfit();
      }

      if (score % 10 === 0) {
        level++;
        beep(1000, .15, "sine", .07);
      }

      return false;
    }

    if (bottle.y > c.height) {
      missed++;
      beep(150, .25, "sawtooth", .08);

      if (missed >= 3) {
        state = "over";

        if (score > best) {
          best = score;
          localStorage.setItem("bc_best", best);
        }

        beep(90, .5, "sawtooth", .09);
      }

      return false;
    }

    return true;
  });
}

function drawBottle(bottle) {
  x.fillStyle = bottle.color;
  x.fillRect(bottle.x - 8, bottle.y - 24, 16, 36);

  x.fillStyle = "#111";
  x.fillRect(bottle.x - 4, bottle.y - 33, 8, 11);

  x.fillStyle = "#fff";
  x.fillRect(bottle.x - 6, bottle.y - 13, 12, 9);
}

function draw() {
  x.clearRect(0, 0, c.width, c.height);

  x.fillStyle = "#243244";
  x.fillRect(0, 560, c.width, 80);

  bottles.forEach(drawBottle);

  x.fillStyle = "#d4a017";
  x.fillRect(crate.x, 578, crate.w, 34);

  x.fillStyle = "#8b5e17";
  x.fillRect(crate.x, 578, crate.w, 8);

  x.fillStyle = "#fff";
  x.font = "20px Arial";
  x.fillText("Score: " + score, 15, 32);
  x.fillText("Level: " + level, 175, 32);
  x.fillText("Missed: " + missed + "/3", 320, 32);

  x.fillStyle = "#fbbf24";
  x.font = "16px Arial";
  x.fillText("Best: " + best, 15, 58);

  x.fillStyle = "#fff";
  x.font = "14px Arial";
  x.fillText("Outfit: " + outfit + "/6", 15, 80);

  if (state === "start") {
    x.fillStyle = "rgba(0,0,0,.82)";
    x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = "#fbbf24";
    x.font = "32px Arial";
    x.fillText("BOTTLE CATCHER", 70, 240);

    x.fillStyle = "#fff";
    x.font = "20px Arial";
    x.fillText("Outfit changes every 20 points", 95, 300);
    x.fillText("Add girl1.png to girl6.png", 115, 335);
    x.fillText("Arrow keys / touch to move", 110, 380);
    x.fillText("Press SPACE or tap to start", 110, 425);
  }

  if (state === "over") {
    x.fillStyle = "rgba(0,0,0,.82)";
    x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = "#fff";
    x.font = "38px Arial";
    x.fillText("GAME OVER", 125, 280);

    x.font = "24px Arial";
    x.fillText("Score: " + score, 185, 330);
    x.fillText("Best: " + best, 190, 365);
    x.fillText("Press R or tap to restart", 120, 410);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

addEventListener("keydown", event => {
  keys[event.key] = true;

  if (event.code === "Space" && state === "start") {
    startGame();
  }

  if (event.key.toLowerCase() === "r" && state === "over") {
    startGame();
  }
});

addEventListener("keyup", event => {
  keys[event.key] = false;
});

c.addEventListener("pointerdown", () => {
  if (audio.state === "suspended") {
    audio.resume();
  }

  if (state === "start" || state === "over") {
    startGame();
  }
});

c.addEventListener("pointermove", event => {
  if (state !== "play") return;

  const rect = c.getBoundingClientRect();
  const scaleX = c.width / rect.width;

  crate.x = Math.max(
    0,
    Math.min(
      c.width - crate.w,
      (event.clientX - rect.left) * scaleX - crate.w / 2
    )
  );
});

gameLoop();
</script>

</body>
</html>
